name: tatis_kiosk
version: 1.0.0+1
description: Kiosk interface for Barberya ni Tatis
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.6
  camera_web: ^0.3.3
  http: ^1.2.2
  image_picker: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/centurygothic.ttf
        - asset: assets/fonts/centurygothic_bold.ttf
          weight: 700
