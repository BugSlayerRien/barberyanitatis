<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tati's Barbershop walk-in kiosk">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tatis_kiosk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tatis Walk-In Kiosk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script type="module">
    let faceLandmarker = null;
    let lastVideoTime = -1;

    async function ensureLandmarker() {
      if (faceLandmarker) {
        return faceLandmarker;
      }

      const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const filesetResolver = await vision.FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );

      faceLandmarker = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath:
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        },
        runningMode: 'VIDEO',
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: true,
      });

      return faceLandmarker;
    }

    window.tatisFaceTrackerReady = false;
    window.initTatisFaceTracker = async function () {
      await ensureLandmarker();
      window.tatisFaceTrackerReady = true;
      return true;
    };

    window.tatisEstimateFace = function (video) {
      if (!video || !faceLandmarker) {
        return null;
      }

      if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
        return null;
      }

      const videoTime = video.currentTime;
      if (videoTime === lastVideoTime) {
        return { status: 'stale' };
      }
      lastVideoTime = videoTime;

      let result = null;
      try {
        result = faceLandmarker.detectForVideo(video, performance.now());
      } catch (_) {
        return { status: 'error' };
      }
      if (!result || !result.faceLandmarks || result.faceLandmarks.length === 0) {
        return { status: 'no_face' };
      }

      const lm = result.faceLandmarks[0];
      let minX = 1;
      let minY = 1;
      let maxX = 0;
      let maxY = 0;

      for (const p of lm) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }

      const leftEye = lm[33];
      const rightEye = lm[263];
      const noseTip = lm[1];

      const dx = rightEye.x - leftEye.x;
      const dy = rightEye.y - leftEye.y;
      const roll = Math.atan2(dy, dx) * (180 / Math.PI);

      const eyeMidX = (leftEye.x + rightEye.x) / 2;
      const eyeMidY = (leftEye.y + rightEye.y) / 2;
      const eyeDist = Math.max(0.0001, Math.sqrt((dx * dx) + (dy * dy)));
      let yaw = ((noseTip.x - eyeMidX) / eyeDist) * 120;
      yaw = Math.max(-60, Math.min(60, yaw));
      const transformMatrix =
        (result.facialTransformationMatrixes && result.facialTransformationMatrixes.length > 0)
          ? Array.from(result.facialTransformationMatrixes[0].data || [])
          : null;

      return {
        bbox: {
          left: Math.max(0, minX),
          top: Math.max(0, minY),
          width: Math.max(0, Math.min(1, maxX - minX)),
          height: Math.max(0, Math.min(1, maxY - minY)),
        },
        eyeMidX: Math.max(0, Math.min(1, eyeMidX)),
        eyeMidY: Math.max(0, Math.min(1, eyeMidY)),
        eyeDistanceNorm: Math.max(0.01, Math.min(1, eyeDist)),
        transformMatrix,
        yaw,
        roll,
      };
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
