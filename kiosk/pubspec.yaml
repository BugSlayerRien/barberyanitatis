name: tatis_kiosk
description: Walk-in kiosk tablet app for Tat's Barbershop.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  tatis_barbershop:
    path: ../mobile-app

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/centurygothic.ttf
        - asset: assets/fonts/centurygothic_bold.ttf
          weight: 700
