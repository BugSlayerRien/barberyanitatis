name: tatis_barbershop
description: "An AI-powered barbershop Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' 

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.5.2

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  camera: ^0.10.6
  camera_web: ^0.3.3
  image_picker: ^0.8.7+4
  google_sign_in: ^6.2.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  google_generative_ai: ^0.4.6
  google_mlkit_face_detection: ^0.11.0
  model_viewer_plus: ^1.8.0
  app_links: ^3.5.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^1.3.0
  url_launcher: ^6.3.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints
  flutter_lints: ^4.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/overlays/barbers/
    - assets/images/overlays/blowout_taper/
    - assets/images/overlays/buzz_cut/
    - assets/images/overlays/caesar_cut/
    - assets/images/overlays/crew_cut/
    - assets/images/overlays/curly_burst_fade/
    - assets/images/overlays/curly_crew_cut/
    - assets/images/overlays/curly_drop_fade/
    - assets/images/overlays/curly_mid_fade/
    - assets/images/overlays/curly_modern_mullet/
    - assets/images/overlays/curly_taper/
    - assets/images/overlays/edgar_cut/
    - assets/images/overlays/french_crop/
    - assets/images/overlays/low_fade/
    - assets/images/overlays/messy_quiff/
    - assets/images/overlays/modern_curtains/
    - assets/images/overlays/modern_mullet/
    - assets/images/overlays/pompadour/
    - assets/images/overlays/textured_crop/
    - assets/images/overlays/two_block/
    - assets/images/overlays/wavy_burst_fade/
    - assets/images/overlays/wavy_fringe/
    - assets/images/overlays/wavy_messy_top/
    - assets/images/overlays/wavy_mod_cut/
    - assets/images/overlays/wavy_side_sweep/
    - assets/models/
    - assets/fonts/

  fonts:
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/centurygothic.ttf
        - asset: assets/fonts/centurygothic_bold.ttf
          weight: 700
  
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section.
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic