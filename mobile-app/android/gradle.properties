# A project-wide Gradle setting to specify the memory allocated to the Gradle Daemon.
# Increasing this can help with larger projects or if you experience OutOfMemory errors.
# Default is often Xmx1024m. 4GB is a common setting for faster builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true

# Use Android Studio's JDK for Gradle (same as `flutter config --jdk-dir`).
# Avoids PKIX/SSL errors from a different Java install missing trusted CAs.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# User trust store — run: powershell -File scripts/fix_gradle_ssl_windows.ps1
# (Java 21+ / Android Studio JBR uses PKCS12, not JKS.)
systemProp.javax.net.ssl.trustStore=C:/Users/user/.gradle/ssl/cacerts
systemProp.javax.net.ssl.trustStorePassword=changeit
systemProp.javax.net.ssl.trustStoreType=PKCS12

# When set to true, this enables the use of AndroidX libraries in your project.
android.useAndroidX=true

# When set to true, this enables the Jetifier, which automatically migrates third-party libraries 
# to use AndroidX, necessary for modern Flutter/Android development.
android.enableJetifier=true

