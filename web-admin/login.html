<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barberya ni Tatis | Web Login</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app" style="grid-template-columns: 1fr;">
      <main class="main" style="max-width: 420px; margin: 0 auto;">
        <div class="header" style="justify-content: center;">
          <h2>Web Admin Login</h2>
        </div>
        <div class="card">
          <form id="login-form" class="grid" style="gap: 12px;">
            <label>
              <div class="meta">Email</div>
              <input id="email" type="email" placeholder="admin@email.com" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #111; color: #fff;" required />
            </label>
            <label>
              <div class="meta">Password</div>
              <input id="password" type="password" placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #111; color: #fff;" required />
            </label>
            <button type="submit" class="card" style="cursor: pointer; text-align: center;">Sign In</button>
            <div id="error" class="meta" style="color: var(--danger);"></div>
          </form>
        </div>
      </main>
    </div>

    <script src="./login.js"></script>
  </body>
</html>
