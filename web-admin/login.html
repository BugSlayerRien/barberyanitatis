<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brilliante Barbershop | Operations Portal Sign In</title>
    <link rel="icon" type="image/png" href="./assets/images/brilliante-icon.png" />
    <link rel="apple-touch-icon" href="./assets/images/brilliante-icon.png" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <section class="login-card" aria-label="Portal sign in">
        <div class="login-brand">
          <img class="login-logo" src="./assets/images/brilliante.png" alt="Brilliante Barbershop"
               onerror="this.setAttribute('hidden',''); document.getElementById('login-pole-fallback').removeAttribute('hidden');" />
          <!-- Shown only if the badge artwork is missing, so the page never
               renders a broken-image box. -->
          <svg id="login-pole-fallback" class="login-pole" viewBox="0 0 32 80" aria-hidden="true" focusable="false" hidden>
            <rect x="1" y="0" width="30" height="9" rx="4" fill="#F2F0EC" />
            <rect x="1" y="71" width="30" height="9" rx="4" fill="#F2F0EC" />
            <clipPath id="pole-barrel">
              <rect x="4" y="9" width="24" height="62" rx="6" />
            </clipPath>
            <g clip-path="url(#pole-barrel)">
              <rect x="4" y="9" width="24" height="62" fill="#F2F0EC" />
              <g fill="#D93B30">
                <path d="M4 0 L28 -13 L28 -3 L4 10 Z" />
                <path d="M4 24 L28 11 L28 21 L4 34 Z" />
                <path d="M4 48 L28 35 L28 45 L4 58 Z" />
                <path d="M4 72 L28 59 L28 69 L4 82 Z" />
              </g>
              <g fill="#3C7DD9">
                <path d="M4 12 L28 -1 L28 9 L4 22 Z" />
                <path d="M4 36 L28 23 L28 33 L4 46 Z" />
                <path d="M4 60 L28 47 L28 57 L4 70 Z" />
              </g>
            </g>
            <rect x="4" y="9" width="24" height="62" rx="6" fill="none" stroke="#08080A" stroke-width="2.5" />
          </svg>
          <!-- No typographic wordmark here: the badge already carries the shop
               name, and repeating it reads as a stutter. -->
          <h1 class="login-title">Operations Portal</h1>
        </div>

        <form id="login-form" class="login-form">
          <label class="login-label">
            <span class="login-meta">Work email</span>
            <input id="email" class="input login-input" type="email" placeholder="name@brilliantebarbershop.com" autocomplete="username" required />
          </label>

          <label class="login-label">
            <span class="login-meta">Password</span>
            <div class="password-field">
              <input id="password" class="input login-input" type="password" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false">
                <svg class="password-toggle-icon password-toggle-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="password-toggle-icon password-toggle-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </label>

          <div id="error" class="login-error" role="alert" aria-live="polite"></div>
          <button type="submit" class="btn primary login-submit">Sign In</button>
          <button type="button" class="login-link" id="forgot-open">Forgot password?</button>
        </form>

        <!-- Two steps in one form: request a code, then enter it with the new
             password. Step 2 stays hidden until a code has been requested. -->
        <form id="reset-form" class="login-form" hidden>
          <label class="login-label">
            <span class="login-meta">Work email</span>
            <input id="reset-email" class="input login-input" type="email" placeholder="name@brilliantebarbershop.com" autocomplete="username" required />
          </label>

          <div id="reset-step2" hidden>
            <label class="login-label">
              <span class="login-meta">Verification code</span>
              <input id="reset-code" class="input login-input" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code from your email" />
            </label>

            <label class="login-label">
              <span class="login-meta">New password</span>
              <input id="reset-password" class="input login-input" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
            </label>
          </div>

          <div id="reset-error" class="login-error" role="alert" aria-live="polite"></div>
          <div id="reset-notice" class="login-meta" role="status" aria-live="polite"></div>
          <button type="submit" class="btn primary login-submit" id="reset-submit">Send code</button>
          <button type="button" class="login-link" id="reset-cancel">Back to sign in</button>
        </form>

        <p class="login-footnote">Authorized personnel only. Portal activity is monitored and logged.</p>
      </section>
    </main>

    <script src="./assets/api-config.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
