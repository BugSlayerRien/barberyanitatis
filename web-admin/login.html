<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barberya ni Tatis | Operations Portal Sign In</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <style>
      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.09), transparent 28%),
          radial-gradient(circle at 90% 90%, rgba(255, 255, 255, 0.07), transparent 34%),
          var(--bg);
      }

      .login-container {
        width: 100%;
        max-width: 440px;
      }

      .login-card {
        background: linear-gradient(145deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.4);
      }

      .login-brand {
        text-align: center;
        margin-bottom: 18px;
      }

      .login-logo {
        width: 86px;
        height: 86px;
        object-fit: contain;
        border-radius: 14px;
        border: 1px solid var(--border-soft);
        background: #111;
        padding: 10px;
      }

      .login-title {
        margin: 14px 0 6px;
        font-size: 24px;
        letter-spacing: 0.3px;
      }

      .login-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .login-form {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .login-label {
        display: grid;
        gap: 6px;
      }

      .login-meta {
        font-size: 12px;
        color: var(--muted);
      }

      .login-input {
        width: 100%;
      }

      .login-submit {
        margin-top: 4px;
        width: 100%;
      }

      .login-error {
        color: var(--danger);
        min-height: 18px;
        font-size: 12px;
      }

      .login-footnote {
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body class="login-page">
    <main class="login-container">
      <section class="login-card" aria-label="Portal Sign In">
        <div class="login-brand">
          <img class="login-logo" src="./assets/images/TATIS.png" alt="Barberya ni Tatis logo" />
          <h1 class="login-title">Operations Portal</h1>
          <p class="login-subtitle">Administrator and Receptionist Secure Access</p>
        </div>

        <form id="login-form" class="login-form">
          <label class="login-label">
            <span class="login-meta">Work Email</span>
            <input id="email" class="input login-input" type="email" placeholder="name@barberyatatis.com" required />
          </label>

          <label class="login-label">
            <span class="login-meta">Password</span>
            <input id="password" class="input login-input" type="password" placeholder="Enter your password" required />
          </label>

          <button type="submit" class="btn login-submit">Sign In to Portal</button>
          <div id="error" class="login-error" role="alert" aria-live="polite"></div>
        </form>

        <p class="login-footnote">Authorized personnel only. Activity is monitored and logged.</p>
      </section>
    </main>

    <script src="./assets/api-config.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
