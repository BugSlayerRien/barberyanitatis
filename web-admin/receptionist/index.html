<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tatis Barbershop | Receptionist Dashboard</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-badge">TB</div>
          <div>
            <h1>RECEPTIONIST</h1>
            <div class="badge">Barberya ni Tatis</div>
          </div>
        </div>
        <nav class="nav">
          <button class="active" data-view="analytics">AI Analytics<span>Walk-ins & KPIs</span></button>
          <button data-view="appointments">Appointments<span>Today</span></button>
          <button data-view="walkins">Walk-ins<span>Queue</span></button>
          <button data-view="tracking">Tracking<span>Service status</span></button>
          <button data-view="barbers">Barbers<span>Team list</span></button>
          <button data-view="logout">Logout<span>Exit</span></button>
        </nav>
      </aside>
      <main class="main">
        <div class="header">
          <h2>Receptionist Dashboard</h2>
          <div style="display: flex; gap: 12px; align-items: center;">
            <span class="badge">Last updated: <span id="last-updated">--</span></span>
            <button class="btn" id="refresh-dashboard">Refresh</button>
          </div>
        </div>

        <section id="analytics-view">
          <div class="grid stats" id="analytics-stats"></div>
          <div class="section-title">Today Summary</div>
          <div class="card">
            <p id="summary-text">Loading summary...</p>
          </div>
        </section>

        <section id="appointments-view" hidden>
          <div class="section-title">Today’s Appointments</div>
          <div class="card">
            <div class="meta" style="margin-bottom: 8px;">Tap an action to update appointment status.</div>
            <table class="table" id="appointments-table"></table>
          </div>
        </section>

        <section id="walkins-view" hidden>
          <div class="section-title">Walk-in Queue</div>
          <div class="card" style="margin-bottom: 16px;">
            <form id="walkin-form" class="form-grid">
              <label>
                <div class="meta">Services</div>
                <select id="walkin-services" class="select" multiple required></select>
              </label>
              <label>
                <div class="meta">Preferred Barber</div>
                <select id="walkin-barber" class="select">
                  <option value="">Unassigned</option>
                </select>
              </label>
              <button type="submit" class="btn">Add Walk-in</button>
              <div id="walkin-error" class="meta" style="color: var(--danger);"></div>
            </form>
          </div>
          <div class="card">
            <table class="table" id="walkins-table"></table>
          </div>
        </section>

        <section id="tracking-view" hidden>
          <div class="section-title">Tracking</div>
          <div class="list" id="tracking-list"></div>
        </section>

        <section id="barbers-view" hidden>
          <div class="section-title">Barbers</div>
          <div class="list" id="barbers-list"></div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
