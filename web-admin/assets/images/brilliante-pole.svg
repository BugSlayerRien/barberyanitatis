<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Brilliante Barbershop">
  <title>Brilliante Barbershop</title>
  <!-- Simplified pole glyph. The full badge's arched lettering is unreadable
       below ~64px, so favicons, tab icons and small chips use this instead. -->
