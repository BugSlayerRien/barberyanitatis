  <g>
    <rect x="22" y="8" width="20" height="7" rx="3" fill="#F2F0EC"/>
    <rect x="22" y="49" width="20" height="7" rx="3" fill="#F2F0EC"/>
    <clipPath id="barrel">
      <rect x="24" y="15" width="16" height="34" rx="4"/>
    </clipPath>
    <g clip-path="url(#barrel)">
      <rect x="24" y="15" width="16" height="34" fill="#F2F0EC"/>
      <g fill="#D93B30">
        <path d="M24 8 L40 -1 L40 6 L24 15 Z"/>
        <path d="M24 25 L40 16 L40 23 L24 32 Z"/>
        <path d="M24 42 L40 33 L40 40 L24 49 Z"/>
      </g>
      <g fill="#3C7DD9">
        <path d="M24 16.5 L40 7.5 L40 14.5 L24 23.5 Z"/>
        <path d="M24 33.5 L40 24.5 L40 31.5 L24 40.5 Z"/>
        <path d="M24 50.5 L40 41.5 L40 48.5 L24 57.5 Z"/>
      </g>
    </g>
    <rect x="24" y="15" width="16" height="34" rx="4" fill="none" stroke="#08080A" stroke-width="2"/>
  </g>
</svg>
