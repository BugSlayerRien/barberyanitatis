<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tatis Barbershop | Admin Dashboard</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-badge">TB</div>
          <div>
            <h1>ADMIN</h1>
            <div class="badge">Barberya ni Tatis</div>
          </div>
        </div>
        <nav class="nav">
          <button class="active" data-view="dashboard">Dashboard<span>Overview & activity</span></button>
          <button data-view="users">Manage Users<span>Customers & staff</span></button>
          <button data-view="audit">Audit Logs<span>Recent actions</span></button>
          <button data-view="analytics">Analytics<span>Performance</span></button>
          <button data-view="services">Manage Services<span>Catalog</span></button>
          <button data-view="settings">System Settings<span>Notifications</span></button>
          <button data-view="logout">Logout<span>Exit</span></button>
        </nav>
      </aside>
      <main class="main">
        <div class="header">
          <h2>Admin Dashboard</h2>
          <span class="badge">Last updated: <span id="last-updated">--</span></span>
        </div>

        <section id="dashboard-view">
          <div class="grid stats" id="stats-grid"></div>

          <div class="section-title">Recent Activity</div>
          <div class="list" id="activity-list"></div>
        </section>

        <section id="users-view" hidden>
          <div class="section-title">Manage Users</div>
          <div class="card">
            <h3>Customers</h3>
            <div class="table" id="customers-table"></div>
          </div>
          <div class="card">
            <h3>Barbers</h3>
            <div class="table" id="barbers-table"></div>
          </div>
          <div class="card">
            <h3>Receptionists</h3>
            <div class="table" id="receptionists-table"></div>
          </div>
          <div class="card">
            <h3>Admins</h3>
            <div class="table" id="admins-table"></div>
          </div>
        </section>

        <section id="audit-view" hidden>
          <div class="section-title">Audit Logs</div>
          <div class="list" id="audit-list"></div>
        </section>

        <section id="analytics-view" hidden>
          <div class="section-title">Analytics</div>
          <div class="card">
            <h3>AI Business Summary</h3>
            <p id="analytics-summary">Loading summary...</p>
          </div>
          <div class="card">
            <h3>Key Metrics</h3>
            <div class="grid stats" id="analytics-metrics"></div>
          </div>
        </section>

        <section id="services-view" hidden>
          <div class="section-title">Manage Services</div>
          <div class="card">
            <h3>Service Catalog</h3>
            <div class="table" id="services-table"></div>
          </div>
        </section>

        <section id="settings-view" hidden>
          <div class="section-title">System Settings</div>
          <div class="card">
            <h3>Operations</h3>
            <div class="form-grid">
              <label>Email Notifications
                <input type="checkbox" id="setting-email" />
              </label>
              <label>Open Time
                <input type="time" id="setting-open" value="09:00" />
              </label>
              <label>Close Time
                <input type="time" id="setting-close" value="18:00" />
              </label>
              <label>Force MFA
                <input type="checkbox" id="setting-mfa" />
              </label>
              <label>Auto Backup
                <input type="checkbox" id="setting-backup" />
              </label>
            </div>
            <button class="btn" id="settings-save">Save Settings</button>
          </div>
          <div class="card">
            <h3>Backup & Restore (CSV)</h3>
            <div class="button-row">
              <button class="btn" data-export="users">Export Users</button>
              <button class="btn" data-export="barbers">Export Barbers</button>
              <button class="btn" data-export="services">Export Services</button>
              <button class="btn" data-export="appointments">Export Appointments</button>
            </div>
            <div class="upload-row">
              <input type="file" id="services-csv" accept=".csv" />
              <button class="btn" id="services-import">Import Services CSV</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
