# Optional Render blueprint (you can also create services in the dashboard).
# Secrets must be set in the Render dashboard — do not put real keys here.

services:
  - type: web
    name: tatis-php-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    # Free plan sleeps when idle; first request after sleep can take 30–90s ("cold start").
    healthCheckPath: /ai_status.php
    # Optional persistent disk (Dashboard → Disks → mount path /var/data):
    # disk:
    #   name: tatis-uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: API_INSECURE_SSL
        value: "false"
      - key: PASSWORD_RESET_DEBUG_TOKEN
        value: "false"
      # Required / recommended (set in dashboard):
      # DB_URL
      # GEMINI_API_KEY (or AI_API_KEY), GEMINI_MODEL
      # AI_TRYON_PROVIDER, XAI_API_KEY / GEMINI_IMAGE_API_KEY / REPLICATE_API_TOKEN
      # AI_SERVICE_URL=https://<your-sidecar>.onrender.com
      # GOOGLE_ALLOWED_CLIENT_IDS, PASSWORD_RESET_BASE_URL, PASSWORD_RESET_MAIL_FROM
      # STORAGE_DRIVER=supabase on Render only (XAMPP stays local)
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (or SUPABASE_SERVICE_ROLE)
      # SUPABASE_STORAGE_PUBLIC_BUCKET=tatis-public
      # SUPABASE_STORAGE_SCANS_BUCKET=tatis-scans
      # PAYMONGO_SECRET (and optional PAYMONGO_WEBHOOK_SECRET)

  - type: web
    name: tatis-ai-sidecar
    runtime: python
    rootDir: ai-service
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      # Set in dashboard if used by sidecar:
      # REPLICATE_API_TOKEN, REPLICATE_FLUX_MODEL
