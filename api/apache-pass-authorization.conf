# Included from Apache server config (conf-enabled), before sites-enabled.
#
# Google / Supabase access tokens in Authorization can exceed Apache's
# default LimitRequestFieldSize (8190). Apache then returns HTML 400
# "Size of a request header field exceeds server limit" and PHP never runs.
# These directives are valid in server config / virtual host only.
LimitRequestFieldSize 32768
LimitRequestLine 16384

# Pass Authorization through to PHP as HTTP_AUTHORIZATION (mod_php).
# CGIPassAuth is valid only in directory / .htaccess — not at server-config root.
<IfModule mod_setenvif.c>
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    SetEnvIf Authorization "(.+)" REDIRECT_HTTP_AUTHORIZATION=$1
</IfModule>

<Directory "/var/www/html">
    CGIPassAuth On
</Directory>
