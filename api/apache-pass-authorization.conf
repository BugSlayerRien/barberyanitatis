# Pass the HTTP Authorization header through to PHP as HTTP_AUTHORIZATION.
# This file is included from Apache server config (conf-enabled).
#
# CGIPassAuth is valid only in directory / .htaccess (Apache 2.4.13+).
# Putting it at the server-config root causes:
#   AH00526: CGIPassAuth not allowed here
<IfModule mod_setenvif.c>
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    SetEnvIf Authorization "(.+)" REDIRECT_HTTP_AUTHORIZATION=$1
</IfModule>

<Directory "/var/www/html">
    CGIPassAuth On
</Directory>
